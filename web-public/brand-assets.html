<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskBridge Brand Assets</title>
    <style>
      :root { color: #0f172a; background: #f6f8fb; font-family: Inter, Arial, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(92vw, 560px); padding: 32px; display: grid; gap: 22px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 18px 50px rgba(15,23,42,.08); }
      h1 { margin: 0; font-size: 1.6rem; }
      p { margin: 0; color: #52636f; line-height: 1.55; }
      .preview { min-height: 260px; display: grid; place-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; }
      .preview img { width: 180px; height: 180px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      a { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: #2563eb; border-radius: 7px; text-decoration: none; font-weight: 800; }
      a.secondary { color: #0f172a; background: #e2e8f0; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>TaskBridge Standalone Logo</h1>
        <p>Use this version when the icon needs to stand apart from the TaskBridge wordmark.</p>
      </div>
      <div class="preview">
        <img src="/taskbridge-standalone-logo.png" alt="TaskBridge standalone logo" />
      </div>
      <div class="actions">
        <a href="/taskbridge-standalone-logo.png" download="taskbridge-standalone-logo.png">Download PNG</a>
        <a class="secondary" href="/taskbridge-standalone-logo.svg" download="taskbridge-standalone-logo.svg">Download SVG</a>
        <a class="secondary" href="/taskbridge-logo.svg" download="taskbridge-logo.svg">Download full logo</a>
      </div>
    </main>
  </body>
</html>
